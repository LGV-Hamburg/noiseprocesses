apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "noise-modelling-api.fullname" . }}-api
  labels:
    {{- include "noise-modelling-api.labels" . | nindent 4 }}
spec:
  maxUnavailable: 75%
  selector:
    matchLabels:
      {{- include "noise-modelling-api.selectorLabels" . | nindent 6 }}
      component: api
